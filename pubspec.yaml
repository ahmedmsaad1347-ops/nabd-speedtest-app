name: nabd_speedtest
description: "نبض — تطبيق اختبار سرعة الإنترنت (Flutter) متصل بالـ Backend الخاص بالمشروع."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # الاتصال بالـ API مع دعم onSendProgress / onReceiveProgress
  # (ضروري لتحديث العداد لحظيًا أثناء التحميل والرفع)
  dio: ^5.4.3+1

  # مراقبة حالة الشبكة (Wi-Fi / بيانات جوال / لا يوجد اتصال)
  connectivity_plus: ^6.0.3

  # معلومات الجهاز (الموديل، إصدار النظام) لعرضها في النتائج
  device_info_plus: ^10.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
