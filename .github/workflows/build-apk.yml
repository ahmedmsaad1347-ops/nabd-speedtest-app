name: بناء APK

# يمكن تشغيله يدويًا من تبويب Actions، أو تلقائيًا عند كل push
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: جلب الكود
        uses: actions/checkout@v4

      - name: تجهيز Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: تجهيز Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: توليد مجلدات android/ios
        # المستودع يحتوي على lib/ و pubspec.yaml فقط. هذا الأمر يولّد
        # بنية المشروع الأصلية (android/, ios/) دون المساس بالكود الموجود.
        run: flutter create --org com.nabd --project-name nabd_speedtest .

      - name: السماح بالاتصال عبر HTTP
        # السيرفر المحلي يعمل على http (وليس https)، وأندرويد 9+ يحجب
        # ذلك افتراضيًا، لذا نفعّل usesCleartextTraffic في الـ manifest.
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<application android:usesCleartextTraffic="true"|' $MANIFEST
          grep -q 'android.permission.INTERNET' $MANIFEST || \
            sed -i 's|<manifest\(.*\)>|<manifest\1>\n    <uses-permission android:name="android.permission.INTERNET"/>|' $MANIFEST
          cat $MANIFEST

      - name: تركيب أيقونة التطبيق واسمه
        # أيقونات جاهزة بكل الكثافات، تُنسخ فوق الأيقونة الافتراضية التي
        # ولّدها flutter create — بدون الاعتماد على أي حزمة خارجية.
        run: |
          cp -r android_icons/mipmap-* android/app/src/main/res/
          sed -i 's|android:label="[^"]*"|android:label="نبض"|' \
            android/app/src/main/AndroidManifest.xml
          ls -R android/app/src/main/res/mipmap-hdpi

      - name: تنزيل الحزم
        run: flutter pub get

      - name: بناء APK
        run: flutter build apk --release

      - name: رفع الـ APK كملف قابل للتنزيل
        uses: actions/upload-artifact@v4
        with:
          name: nabd-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
